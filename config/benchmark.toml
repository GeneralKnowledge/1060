# Benchmark definition. PROTECTED: experiments may not change this file or
# anything under benchmarks/. Changes need a human to run
# `python3 -m lab approve-benchmark`, which bumps the lock in config/benchmark.lock.
version = "b1"

[defaults]
repetitions = 5          # llama-bench -r
rounds = 2               # baseline/candidate alternate this many times (A B A B)
n_prompt = [512, 2048]   # prompt-processing tests (pp)
n_gen = [128]            # token-generation tests (tg)
cooldown_max_delta_c = 5 # start a round only when GPU temp is within this of the idle temp
cooldown_timeout_s = 300
warmup = true

[workloads.small]
# Primary balanced workload: fits fully on a 6 GB card with room for KV cache.
model = "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
sha256 = "6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff"
family = "llama-3.2-3b"
ctx = 4096

[workloads.qwen35-4b]
# Qwen3.5-4B: hybrid architecture (24 Gated DeltaNet linear-attention layers + 8 full-attention
# layers, head_dim 256). A separate model family with its own reference logits, kernel suites
# and winners directory: its results are never compared with Llama's. See docs/qwen35.md.
model = "models/Qwen3.5-4B-Q4_K_M.gguf"
sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4"   # 2,740,937,888 bytes
family = "qwen3.5-4b"
ctx = 4096
winners = "winners/qwen35-4b"
research_brief = "research/workloads/qwen35-4b.md"
source = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF"
source_revision = ""     # pin the Hugging Face commit the file was downloaded from
arch = "qwen35"

[workloads.capacity]
model = "models/Llama-3.1-8B-Instruct-Q4_K_M.gguf"
sha256 = ""
family = "llama-3.1-8b"
ctx = 4096

[quality]
# KL divergence vs reference logits produced from a Q8_0 build of the same family.
dataset = "benchmarks/workloads/wikitext-2-test-slice.txt"
dataset_sha256 = "e8fc172f4319d08cc7bcd84a8472a552185b858f62b88e33f673d1d005b4f844"
chunks = 20
max_mean_kld = 0.03      # candidate fails if mean KLD vs reference exceeds this
max_ppl_ratio = 1.01     # ...or perplexity rises more than 1% vs baseline

[quality.decode]
# Decode-path check: the same text with one token per ubatch, so the batch-1 kernels
# (MMVQ, flash-attention vec) produce the logits. The batched run above never runs
# them. Compared with the baseline's decode perplexity in the same session.
enabled = true
chunks = 2
ubatch_size = 1
max_ppl_ratio = 1.01

[kernel_check]
# test-backend-ops compares each CUDA op with the CPU backend. A candidate fails if any
# case fails that passes on the baseline build (known upstream failures don't block).
# These suites cover the tensor types and head size of the Llama-3.2-3B Q4_K_M model. A family
# can replace them with its own kernel_suites (see qwen3.5-4b).
# CUDA builds only for now; other backends are not checked.
enabled = true
backend = "CUDA0"

[[kernel_check.suites]]
ops = "MUL_MAT"
params = "type_a=(q4_K|q6_K|f16|f32),type_b=f32"

[[kernel_check.suites]]
ops = "FLASH_ATTN_EXT"
params = "hsk=128,hsv=128"

[[kernel_check.suites]]
ops = "RMS_NORM,ROPE,SOFT_MAX,GET_ROWS,SWIGLU,ADD,MUL,CPY,SET_ROWS"

[families."llama-3.2-3b"]
reference_logits = "models/llama-3.2-3b-q8_0.kld"

[families."qwen3.5-4b"]
reference_logits = "models/qwen3.5-4b-q8_0.kld"
reference_model = "models/Qwen3.5-4B-Q8_0.gguf"
reference_model_sha256 = "10cc391b403021dd11c614679d2fd92f611c3681d29e29651b717316965d61e1"   # 4,482,403,488 bytes
# Kernel suites for this family replace [[kernel_check.suites]]. They follow the ops that
# llama.cpp b12021 builds for qwen35 (src/models/qwen35.cpp, delta-net-base.cpp) on CUDA,
# where the fused GATED_DELTA_NET path is used for both prompt and decode. See
# docs/qwen35.md for the op list, what each suite covers and what it does not.
[[families."qwen3.5-4b".kernel_suites]]
ops = "MUL_MAT"
params = "type_a=(q4_K|q5_K|q6_K|q8_0|f16|f32),type_b=f32"
[[families."qwen3.5-4b".kernel_suites]]
# Full-attention layers: 16 Q heads, 4 KV heads, head_dim 256.
ops = "FLASH_ATTN_EXT"
params = "hsk=256,hsv=256"
[[families."qwen3.5-4b".kernel_suites]]
# Linear-attention layers: fused recurrent/chunked DeltaNet and the causal conv over q/k/v.
ops = "GATED_DELTA_NET,SSM_CONV,L2_NORM"
[[families."qwen3.5-4b".kernel_suites]]
# Unfused DeltaNet fallback (used only if the fused op is unsupported) and gating ops.
ops = "CUMSUM,TRI,SOLVE_TRI,SIGMOID,SOFTPLUS,SILU,EXP,CONCAT,PAD"
[[families."qwen3.5-4b".kernel_suites]]
ops = "RMS_NORM,ROPE,SOFT_MAX,GET_ROWS,SWIGLU,ADD,MUL,CPY,SET_ROWS,SCALE"

[families."llama-3.1-8b"]
reference_logits = "models/llama-3.1-8b-q8_0.kld"

[evaluation]
min_effect = 0.01        # ignore changes below 1 %
noise_k = 2.0            # change must exceed k x measured noise
# Balanced score = weighted geometric mean of candidate/baseline ratios.
[evaluation.weights]
tg = 0.35
pp = 0.20
ttft = 0.20
vram = 0.10
host_ram = 0.05
efficiency = 0.10

# The continuous mind (python3 -m mind). Hard limits only: everything the mind
# may tune for itself lives in mind/params.py and is adjusted by the mind.
[mind]
tick_s = 5.0                 # real seconds per tick when living in real time
tracker_capacity = 300       # regularities it can follow at once
max_steps_per_window = 400   # compute cap per self-tuning window
param_window = 300           # ticks between self-tuning decisions
checkpoint_every = 12        # ticks between checkpoints (one minute at 5 s)
forget_age = 3000            # ticks before unsurprising percepts may fade
dream_control = 0.5          # share of dreams paired with a random control (evaluation only)
min_forward = 8              # forward observations before a hypothesis can become a belief

# Language tiers (A2). Paths are relative to the code checkout. A tier whose model
# file is missing is simply absent: the mind falls back to its algorithms.
[tiers.fast]
model = "models/mind/LFM2.5-350M-Q8_0.gguf"
port = 8111
threads = 2
ctx = 4096
max_tokens = 128
temperature = 0.1
json_schema = true
idle_unload_s = 300                # unload 5 min after the last message

[tiers.reflective]
model = "models/mind/LFM2.5-1.2B-Thinking-Q4_K_M.gguf"
port = 8112
threads = 4
ctx = 8192
max_tokens = 3072
temperature = 0.05
json_schema = false          # thinking model: let it reason, then read the last JSON object
idle_unload_s = 600
min_free_mb = 1500           # do not load it when less RAM than this is free

# Deep tier (A3): Qwen3.5-4B on the GPU with the lab's winning settings. Loaded only when
# recruited and only if no other process uses the GPU; unloaded after 10 idle minutes.
# The model file comes from the lab checkout (symlink models/Qwen3.5-4B-Q4_K_M.gguf in a worktree).
[tiers.deep]
model = "models/Qwen3.5-4B-Q4_K_M.gguf"
port = 8113
gpu = true
ngl = 99
threads = 4
ctx = 8192
extra_args = ["-fa", "on", "-b", "2048", "-ub", "256", "-lm", "none"]
max_tokens = 512
chat_template_kwargs = { enable_thinking = false }   # with thinking, 10/10 dream calls ran out at 2048 tokens
temperature = 0.3
json_schema = false
idle_unload_s = 600
min_free_mb = 1500

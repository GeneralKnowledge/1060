# Research agent configuration. Provider-independent: pick one [provider] kind.
[provider]
kind = "command"            # anthropic | openai_compatible | command
argv = ["claude", "-p", "--tools", "", "--model", "claude-opus-5-5", "--effort", "high"]
timeout_s = 900
model = "claude-opus-5-5"
effort = "high"
max_tokens = 16000
api_key_env = "ANTHROPIC_API_KEY"
# openai_compatible: base_url = "https://api.openai.com/v1", api_key_env = "OPENAI_API_KEY"
# command: argv = ["claude", "-p"]   (prompt on stdin, reply on stdout)

[session]
max_experiments = 20
max_hours = 8
pause_between_s = 30
stop_file = "experiments/STOP"     # touch this to stop a session cleanly
workload = "qwen35-4b"

[permissions]
# Paths (relative to repo root) the agent may create or modify inside an
# experiment worktree. Everything else is rejected by the controller.
editable = ["backends/experimental/", "experiments/configurations/"]
protected = ["benchmarks/", "config/", "lab/", "winners/", "scripts/", "research/hardware_profile.json"]

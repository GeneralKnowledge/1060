# Safety limits. Enforced by lab/safety.py independently of the research agent.
# The agent cannot change this file (protected path).
[limits]
gpu_temp_max_c = 87          # abort experiment above this
gpu_temp_warn_c = 82
vram_max_fraction = 0.98
host_mem_available_min_mb = 512
disk_free_min_gb = 5
experiment_time_budget_s = 300     # cheap software experiments
build_time_budget_s = 3600         # compilation
telemetry_stale_s = 15             # nvidia-smi silent this long = driver unhealthy
max_consecutive_failures = 3       # session stops after this many crashes/aborts
# Power state (laptop). A worn battery makes Dell firmware cap the GPU (seen: 55 W
# instead of 70 W, memory 3000 instead of 3800 MHz) or cut power under load.
require_ac = true                  # refuse to start a measurement on battery
battery_min_pct = 10               # refuse to start below this charge (0 disables)
power_limit_min_w = 65             # a run whose GPU power limit drops below this is rejected

[policy]
# Executables an experiment may launch (resolved basename). Everything else is refused.
allowed_executables = ["llama-bench", "llama-perplexity", "llama-cli", "llama-server", "test-backend-ops",
                       "cmake", "git", "nvidia-smi"]
# Anything matching these needs explicit human approval (Mode 2/3) and is
# written to experiments/proposals/ instead of being run.
approval_required_patterns = [
  "sudo", "nvflash", "nvidia-smi -pl", "nvidia-smi -lgc", "nvidia-smi -lmc", "nvidia-smi -ac",
  "nvidia-smi -pm", "nvidia-smi -r", "nvidia-settings", "/sys/", "/dev/", "modprobe", "insmod",
  "apt", "dpkg", "grub", "update-initramfs", "systemctl", "dell-smm", "i8kctl", "setpci", "rw-mmio",
]
